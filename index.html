      "category": "studio",
      "description": "For my individual edit, I rearranged the original footage to create a fragmented flashback structure. The first flashback is triggered by the shot of the note. I then divided the character’s reaction into several shorter shots, returning briefly to the present between each memory. This allows the three flashbacks to appear as separate fragments rather than as one continuous sequence. I placed the short rubbish sequence between the longer computer and collision sequences to interrupt the rhythm and gradually build the character’s anxiety.\n\nI also experimented with transitions, layered sound effects, music, colour grading, and a camcorder-style visual treatment. The present-day classroom scenes use a warmer tone, while the flashbacks have darker and cooler colours to make the shifts in time clearer. Some dialogue was removed, leaving only selected words such as “Fuck you,” so that the memories feel incomplete and subjective. I used two pieces of background music and additional sound effects to connect the different sections and support the changes in mood. The film finally returns to the classroom, where a wide shot shows the character sitting alone and holding his head, reinforcing his isolation and unease.",

 if(windows.has(key)){focusWindow(windows.get(key));return windows.get(key)}

 w.querySelector('[data-action="max"]').onclick=()=>w.classList.toggle('maximized');

 const dragStart=e=>{if(e.button!==0||e.target.closest('button')||w.classList.contains('maximized'))return;e.preventDefault();const x=e.clientX,y=e.clientY,left=w.offsetLeft,top=w.offsetTop;const move=n=>{w.style.left=Math.max(0,Math.min(1672-w.offsetWidth,left+(n.clientX-x)/scale))+'px';w.style.top=Math.max(49,Math.min(840,top+(n.clientY-y)/scale))+'px'};const end=()=>{bar.onpointermove=null;document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',end)};try{bar.setPointerCapture?.(e.pointerId)}catch{};bar.onpointermove=move;document.addEventListener('mousemove',move);document.addEventListener('mouseup',end);bar.onpointerup=bar.onpointercancel=end};

 const video=p.materials.find(m=>m.kind==='video'||m.kind==='youtube');
 if(video?.kind==='youtube'){const frame=document.createElement('iframe');frame.src=video.url;frame.title=p.filmTitle||p.title;frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';body.querySelector('.video-panel').append(frame)}
 else if(video){const panel=body.querySelector('.video-panel');const v=document.createElement('video');v.controls=true;v.preload='metadata';v.playsInline=true;v.src=video.url;v.setAttribute('aria-label',p.filmTitle||p.title);const launch=document.createElement('button');launch.className='video-launch';launch.type='button';launch.textContent='▶  Play film';launch.setAttribute('aria-label','Play film');launch.onclick=()=>{v.play().catch(()=>{});launch.hidden=true};v.addEventListener('play',()=>launch.hidden=true);v.addEventListener('pause',()=>{if(v.currentTime===0)launch.hidden=false});v.addEventListener('error',()=>{launch.textContent='Open film file ↗';launch.onclick=()=>window.open(video.url,'_blank','noopener');launch.hidden=false});panel.append(v,launch)}
 else body.querySelector('.video-panel').innerHTML='<p>Video coming soon.</p>';
 for(const m of p.materials.filter(m=>!['video','youtube'].includes(m.kind))){const b=document.createElement('button');b.className='material-link';b.innerHTML=icon(m.kind==='image'?'story':'script')+'<span>'+esc(m.title)+'</span><b>›</b>';b.onclick=()=>material(m);body.querySelector('.project-links').append(b)}
 });
}
function renderRoute(){
 clearWindows();page=location.hash.startsWith('#studio')?'studio':'home';
 document.querySelector('#home-screen').hidden=page!=='home';document.querySelector('#studio-screen').hidden=page!=='studio';document.querySelector('#home').classList.toggle('active',page==='home');
 if(page==='home')about();
 else {
  const id=decodeURIComponent(location.hash.split('/')[1]||'');
  const selected=data.projects.find(p=>p.id===id);
  if(selected)project(selected);
 }
}
function navigate(dest,id=''){const hash=dest==='home'?'#home':id?'#studio/'+encodeURIComponent(id):'#studio';if(location.hash===hash)renderRoute();else location.hash=hash}
document.querySelector('#desktop').append(button('Film','film',()=>folder('films')),button('Studio Works','camera',()=>navigate('studio')),button('About Me','polaroid',about),button('Contact','mail',contact),button('Resume','resume',()=>material({id:'resume',title:'Resume',kind:'image',url:data.resumeImage})));
document.querySelector('#studio-icons').append(button('Week 1 Flashback','camera',()=>project(data.projects[0])),button('Other Works','reel',()=>folder('other')));
document.querySelector('#home').onclick=document.querySelector('#start').onclick=()=>navigate('home');document.querySelector('#about').onclick=about;
function clock(){const now=new Date();const date=new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(now);const time=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit'}).format(now);document.querySelector('#clock').textContent=date+'　'+time;document.querySelector('#clock').dateTime=now.toISOString()}
addEventListener('hashchange',renderRoute);clock();setInterval(clock,1000);renderRoute();
</script></body></html>
