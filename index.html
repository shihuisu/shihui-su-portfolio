      "title": "Week 1 Flashback",
      "category": "studio",
      "description": "For my individual edit, I rearranged the original footage to create a fragmented flashback structure. The first flashback is triggered by the shot of the note. I then divided the character’s reaction into several shorter shots, returning briefly to the present between each memory. This allows the three flashbacks to appear as separate fragments rather than as one continuous sequence. I placed the short rubbish sequence between the longer computer and collision sequences to interrupt the rhythm and gradually build the character’s anxiety.\n\nI also experimented with transitions, layered sound effects, music, colour grading, and a camcorder-style visual treatment. The present-day classroom scenes use a warmer tone, while the flashbacks have darker and cooler colours to make the shifts in time clearer. Some dialogue was removed, leaving only selected words such as “Fuck you,” so that the memories feel incomplete and subjective. I used two pieces of background music and additional sound effects to connect the different sections and support the changes in mood. The film finally returns to the classroom, where a wide shot shows the character sitting alone and holding his head, reinforcing his isolation and unease.",

      "descriptionTitle": "Description",
      "description": "ONE MINUTE is a short photo-roman about regret and a missed chance to reconnect. After a breakup, a boy receives “I’m leaving now” and rushes to the station, hoping to reach his partner before she leaves. He arrives too late and can only watch the train depart. He then receives “I’m sorry” and breaks down on the platform.\n\nI used black-and-white photographs and mostly hard cuts to keep the style simple. The sequence of hallways, stairs and outdoor spaces suggests movement, while the narration explains why he is rushing. Rain, train and message sounds connect the images and support the atmosphere.\n\nPlacing “I’m sorry” after the train leaves gives the ending a clear emotional progression. The apology arrives when it can no longer change the situation. I also adjusted the pacing so the final line, “He was one minute too late,” falls on the photograph of him holding his head. A short fade into END gives the audience a moment to connect the final image with the meaning of the title.",

 if(windows.has(key)){focusWindow(windows.get(key));return windows.get(key)}
 const w=document.createElement('section');w.className='window '+kind;w.dataset.key=key;w.setAttribute('role','dialog');w.setAttribute('aria-label',title);w.style.zIndex=++layer;
 const project=kind==='project-window';
 w.innerHTML='<div class="titlebar">'+(project?controls(true):'')+'<h2>'+esc(title)+'</h2>'+(project?'<span class="menu-labels" aria-hidden="true">File　 |　 Edit　 |　 View　 |　 Help</span>':controls(false,kind==='about-window'))+'</div><div class="window-body"></div>';

 const minButton=w.querySelector('[data-action="min"]');
 if(minButton)minButton.onclick=()=>{w.hidden=true;w.querySelectorAll('video,audio').forEach(v=>v.pause());const task=document.createElement('button');task.dataset.task=key;task.textContent=title;task.onclick=()=>focusWindow(w);document.querySelector('#tasks').append(task)};
 w.querySelector('[data-action="max"]').onclick=()=>w.classList.toggle('maximized');

 w.addEventListener('keydown',e=>{if(e.key==='Escape')w.querySelector('[data-action="close"]').click()});
 const bar=w.querySelector('.titlebar');
 const dragStart=e=>{if(e.button!==0||e.target.closest('button')||w.classList.contains('maximized'))return;e.preventDefault();const x=e.clientX,y=e.clientY,left=w.offsetLeft,top=w.offsetTop;const move=n=>{w.style.left=Math.max(0,Math.min(1672-w.offsetWidth,left+(n.clientX-x)/scale))+'px';w.style.top=Math.max(49,Math.min(840,top+(n.clientY-y)/scale))+'px'};const end=()=>{bar.onpointermove=null;document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',end)};try{bar.setPointerCapture?.(e.pointerId)}catch{};bar.onpointermove=move;document.addEventListener('mousemove',move);document.addEventListener('mouseup',end);bar.onpointerup=bar.onpointercancel=end};

}
function about(){makeWindow('about','About Me','about-window',body=>{
 body.innerHTML='<article class="about-copy"><h1>Hi, I’m Shihui.</h1><p class="lead">A film and media student.<br>Video editor.</p><p>'+esc(data.about||'A growing collection of my films, course exercises and visual planning.')+'</p><p>Through this portfolio, I share my projects and the work that goes into making them.</p></article><figure class="polaroid"><div class="photo-space">Personal photo<br>coming soon</div><figcaption>Same sky,<br>different stories.</figcaption></figure><div class="about-signature">Good<br>things take time.</div><div class="about-tagline">FILM　 /　 PEOPLE　 /　 A BRIGHTER TOMORROW</div>';
})}
function contact(){makeWindow('contact','Contact','text-window',body=>{body.innerHTML='<div class="contact-card"><p class="contact-kicker">CONTACT ME</p><h1>Let’s create something.</h1>'+(data.email?'<a class="contact-email" href="mailto:'+esc(data.email)+'">'+esc(data.email)+'</a>':'<p>Contact details coming soon.</p>')+(data.location?'<p class="contact-location">'+esc(data.location)+'</p>':'')+'</div>'})}
function material(m){makeWindow('material-'+m.id,m.title,m.kind==='pdf'?'pdf-window':'image-window',body=>{
 if(m.kind==='pdf'){const a=document.createElement('a');a.className='file-download';a.textContent='Open / download PDF ↗';a.href=m.url;a.target='_blank';a.rel='noopener';const f=document.createElement('iframe');f.title=m.title;f.src=m.url;body.append(a,f)}
 else{const img=document.createElement('img');img.src=m.url;img.alt=m.title;img.onerror=()=>{body.textContent='This image could not be loaded.'};body.append(img)}
})}
function folder(kind){makeWindow('folder-'+kind,kind==='films'?'Film':'Other Works','folder-window',body=>{
 body.classList.add('folder-grid');
 if(kind==='films'){for(const p of data.projects.filter(p=>p.category==='films'))body.append(button(p.title,'film',()=>navigate('studio',p.id)))}
 else{for(const p of data.projects.filter(p=>p.id!=='flashback-sequence'&&p.category!=='films'))body.append(button(p.title,'camera',()=>project(p)));for(const m of data.materials)body.append(button(m.title,'story',()=>material(m)))}
 if(!body.children.length)body.innerHTML='<p class="empty">Film projects will be added here.</p>';
})}
function project(p){
 const w=makeWindow('project-'+p.id,p.title,'project-window',body=>{
 const descriptionTitle=p.descriptionTitle||'Final Cut Description';
 body.innerHTML='<div class="project-layout"><div class="video-panel"></div><article class="project-info"><h1>'+esc(p.projectTitle||p.title)+'</h1>'+(p.filmTitle?'<p class="film-title">'+esc(p.filmTitle)+'</p>':'')+'<h2 class="description-heading">'+esc(descriptionTitle)+'</h2><div class="description" tabindex="0" aria-label="'+esc(descriptionTitle)+'">'+(p.description||'Description coming soon.').split(/\n\n/).map(t=>'<p>'+esc(t)+'</p>').join('')+'</div><div class="project-links"></div></article></div>';
 const video=p.materials.find(m=>m.kind==='video'||m.kind==='youtube');
 if(video?.kind==='youtube'){const frame=document.createElement('iframe');frame.src=video.url;frame.title=p.projectTitle||p.filmTitle||p.title;frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';body.querySelector('.video-panel').append(frame)}
 else if(video){const panel=body.querySelector('.video-panel');const v=document.createElement('video');v.controls=true;v.preload='metadata';v.playsInline=true;v.src=video.url;v.setAttribute('aria-label',p.filmTitle||p.title);const launch=document.createElement('button');launch.className='video-launch';launch.type='button';launch.textContent='▶  Play film';launch.setAttribute('aria-label','Play film');launch.onclick=()=>{v.play().catch(()=>{});launch.hidden=true};v.addEventListener('play',()=>launch.hidden=true);v.addEventListener('pause',()=>{if(v.currentTime===0)launch.hidden=false});v.addEventListener('error',()=>{launch.textContent='Open film file ↗';launch.onclick=()=>window.open(video.url,'_blank','noopener');launch.hidden=false});panel.append(v,launch)}
 else body.querySelector('.video-panel').innerHTML='<p>Video coming soon.</p>';
 for(const m of p.materials.filter(m=>!['video','youtube'].includes(m.kind))){const b=document.createElement('button');b.className='material-link';b.innerHTML=icon(m.kind==='image'?'story':'script')+'<span>'+esc(m.title)+'</span><b>›</b>';b.onclick=()=>material(m);body.querySelector('.project-links').append(b)}
 });
 w.classList.toggle('portrait-project',p.orientation==='portrait');
}
function renderRoute(){
 clearWindows();page=location.hash.startsWith('#studio')?'studio':'home';
 document.body.classList.toggle('studio-page',page==='studio');
 document.querySelector('#home-screen').hidden=page!=='home';document.querySelector('#studio-screen').hidden=page!=='studio';document.querySelector('#home').classList.toggle('active',page==='home');
 if(page==='home')about();
 else {
  const id=decodeURIComponent(location.hash.split('/')[1]||'');
  const selected=data.projects.find(p=>p.id===id);
  if(selected)project(selected);
 }
}
function navigate(dest,id=''){const hash=dest==='home'?'#home':id?'#studio/'+encodeURIComponent(id):'#studio';if(location.hash===hash)renderRoute();else location.hash=hash}
document.querySelector('#desktop').append(button('Film','film',()=>folder('films')),button('Studio Works','camera',()=>navigate('studio')),button('About Me','polaroid',about),button('Contact','mail',contact),button('Resume','resume',()=>material({id:'resume',title:'Resume',kind:'image',url:data.resumeImage})));
document.querySelector('#studio-icons').append(
 button('Week 1 Flashback','camera',()=>project(data.projects.find(p=>p.id==='flashback-sequence'))),
 button('Week 2 Photo-roman','shortfilm',()=>project(data.projects.find(p=>p.id==='one-minute'))),
 button('Other Works','reel',()=>folder('other'))
);
document.querySelector('#home').onclick=document.querySelector('#start').onclick=()=>navigate('home');document.querySelector('#about').onclick=about;
function clock(){const now=new Date();const date=new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(now);const time=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit'}).format(now);document.querySelector('#clock').textContent=date+'　'+time;document.querySelector('#clock').dateTime=now.toISOString()}
addEventListener('hashchange',renderRoute);clock();setInterval(clock,1000);renderRoute();
</script></body></html>
